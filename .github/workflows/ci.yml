# CI keeps the public repo honest without requiring Jules or Antigravity auth.
# The tests use deterministic fake/local paths and validate the MCP protocol
# surface on both Linux and Windows.
#
# The pytest step is not optional decoration. Every mutation test added in the
# three-vendor upgrade lives under tests/, and a mutation test that CI does not
# run is a guard that only exists in the commit message. See docs/SAI.md W10.
name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile server.py antigravity_report_server.py tests/protocol_smoke.py tests/report_server_smoke.py
      - name: Unit and mutation-guard tests
        run: python -m pytest -q tests
      - name: Main MCP smoke
        run: python tests/protocol_smoke.py
      - name: Report MCP smoke
        run: python tests/report_server_smoke.py
